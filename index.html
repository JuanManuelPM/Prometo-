<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d2d2d">
<title>Prometeo</title>
<style>
:root{
  --bg:#2d2d2d;--bg2:#242424;--paper:#eae0d2;--muted:#cbbda5;
  --line:#514c46;--mint:#a8d8c1;--good:#b5c8a7;--warn:#d2b57b;--bad:#c98c7b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
main{max-width:680px;margin:auto;padding:14px 12px 88px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:18px;letter-spacing:.09em;margin:0}
.small{font-size:11px;color:var(--muted)}
button,textarea,input{font:inherit}
textarea{width:100%;min-height:112px;background:var(--bg2);color:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px;outline:none;resize:vertical}
textarea:focus{border-color:var(--mint)}
.primary{width:100%;margin-top:8px;border:0;border-radius:12px;padding:12px 14px;background:var(--paper);color:#222;font-weight:750}
.ghost{border:1px solid var(--line);background:transparent;color:var(--paper);border-radius:10px;padding:7px 9px}
section{margin-top:24px}
h2{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
.item{border-top:1px solid var(--line);padding:11px 0}
.title{font-weight:700;font-size:14px}
.meta,.body{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.signal{min-width:42px;border:1px solid var(--line);background:transparent;color:var(--paper);border-radius:10px;padding:7px 9px}
.empty{font-size:12px;color:#91877b;padding:8px 0}
.pill{display:inline-block;font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--warn)}
.dot.good{background:var(--good)}
.dot.bad{background:var(--bad)}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#151515;color:var(--paper);padding:10px 13px;border-radius:10px;display:none;max-width:92vw;z-index:20}
dialog{width:min(94vw,520px);border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--paper);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
input{width:100%;background:#1e1e1e;color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
code{font-size:11px}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>PROMETEO</h1>
    <div id="status" class="small">modo local</div>
  </div>
  <button id="settingsBtn" class="ghost" type="button">⚙</button>
</header>

<form id="composer">
  <textarea id="input" placeholder="¿Qué querés que haga Prometeo?"></textarea>
  <button class="primary" type="submit">ENVIAR</button>
</form>

<section>
  <h2>AHORA</h2>
  <div id="now"></div>
</section>

<section>
  <h2>NECESITA DE VOS</h2>
  <div id="needs"></div>
</section>

<section>
  <h2>LISTO</h2>
  <div id="done"></div>
</section>

<section>
  <h2>ÚLTIMOS INPUTS</h2>
  <div id="events"></div>
</section>
</main>

<div id="toast"></div>

<dialog id="settings">
  <form method="dialog">
    <h2 style="font-size:14px;color:var(--paper)">CONEXIÓN</h2>
    <div class="body">Por ahora funciona sin servidor usando almacenamiento local. En el segundo paso vas a pegar acá la URL de Apps Script.</div>
    <label for="apiUrl">Apps Script API URL</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="row">
      <button id="saveSettings" class="primary" value="default" type="button">GUARDAR</button>
      <button class="ghost" value="cancel">CERRAR</button>
    </div>
  </form>
</dialog>

<script>
const STORE_KEY='prometeo_home_v0_state';
const API_KEY='prometeo_home_v0_api';
const SIGNALS=[['★','ADOPT'],['↻','IMPROVE'],['?','INVESTIGATE'],['×','REJECT'],['✓','ACCEPT']];

function id(prefix){return prefix+'_'+Date.now().toString(36).toUpperCase()+'_'+Math.random().toString(36).slice(2,8).toUpperCase()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}

function loadLocal(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||seed()}catch{return seed()}
}
function seed(){return {events:[],work_items:[],artifacts:[],signals:[],updated_at:new Date().toISOString()}}
function saveLocal(s){s.updated_at=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(s))}

async function api(action,payload={}){
  const base=localStorage.getItem(API_KEY)||'';
  if(!base) return null;
  const r=await fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}

async function getState(){
  const base=localStorage.getItem(API_KEY)||'';
  if(base){
    try{
      const r=await fetch(base+'?action=state&ts='+Date.now(),{cache:'no-store'});
      if(r.ok){
        const data=await r.json();
        document.getElementById('status').textContent='online · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        return data;
      }
    }catch(e){}
  }
  document.getElementById('status').textContent='modo local';
  return loadLocal();
}

async function submitInput(text){
  const base=localStorage.getItem(API_KEY)||'';
  if(base){
    try{return await api('input',{text})}catch(e){toast('Falló online; guardado local')}
  }
  const s=loadLocal();
  s.events.unshift({event_id:id('EVT'),created_at:new Date().toISOString(),type:'HUMAN_INPUT',text,status:'NEW'});
  saveLocal(s);
  return {ok:true,local:true};
}

async function submitSignal(target,signal){
  const base=localStorage.getItem(API_KEY)||'';
  if(base){
    try{return await api('signal',{target_id:target,signal})}catch(e){toast('Falló online; guardado local')}
  }
  const s=loadLocal();
  s.signals.unshift({signal_id:id('SIG'),created_at:new Date().toISOString(),target_id:target,signal,status:'NEW'});
  saveLocal(s);
  return {ok:true,local:true};
}

function render(s){
  const work=s.work_items||s.now||[];
  const artifacts=s.artifacts||[];
  const byId=Object.fromEntries(artifacts.map(a=>[a.artifact_id,a]));
  const active=work.filter(w=>!['DONE','CANCELLED'].includes(String(w.status)));
  const need=active.filter(w=>String(w.status)==='WAITING_HUMAN');
  const done=work.filter(w=>String(w.status)==='DONE');

  const wiTitle=w=>esc(w.title||w.goal||w.work_item_id||'Trabajo');
  const artFor=w=>{
    if(w.candidate) return w.candidate;
    if(w.champion) return w.champion;
    return byId[w.candidate_artifact_id]||byId[w.champion_artifact_id]||null;
  };

  document.getElementById('now').innerHTML=active.length?active.map(w=>{
    const a=artFor(w);
    return `<div class="item">
      <div class="title"><span class="dot"></span>${wiTitle(w)}</div>
      <div class="meta">${esc(w.status||'')}</div>
      ${w.exact_next?`<div class="body">${esc(w.exact_next)}</div>`:''}
      ${a?.body_preview?`<div class="body">${esc(a.body_preview)}</div>`:''}
    </div>`
  }).join(''):'<div class="empty">Nada activo.</div>';

  document.getElementById('needs').innerHTML=need.length?need.map(w=>{
    const target=w.candidate?.artifact_id||w.candidate_artifact_id||w.work_item_id;
    return `<div class="item">
      <div class="title">${wiTitle(w)}</div>
      <div class="row">${SIGNALS.map(([l,s])=>`<button class="signal" data-target="${esc(target)}" data-signal="${s}" type="button">${l}</button>`).join('')}</div>
    </div>`
  }).join(''):'<div class="empty">No necesitás hacer nada.</div>';

  document.getElementById('done').innerHTML=done.length?done.slice(0,8).map(w=>`<div class="item">
    <div class="title"><span class="dot good"></span>${wiTitle(w)}</div>
  </div>`).join(''):'<div class="empty">Todavía no hay trabajos terminados.</div>';

  const ev=s.events||s.recent_events||[];
  document.getElementById('events').innerHTML=ev.length?ev.slice(0,8).map(e=>`<div class="item">
    <div class="body">${esc(e.text||'')}</div>
    <div class="meta">${esc(e.status||'')} · ${esc((e.created_at||'').replace('T',' ').slice(0,16))}</div>
  </div>`).join(''):'<div class="empty">Todavía no enviaste nada.</div>';
}

async function refresh(){render(await getState())}

document.getElementById('composer').addEventListener('submit',async e=>{
  e.preventDefault();
  const box=document.getElementById('input');
  const text=box.value.trim();
  if(!text)return;
  box.value='';
  await submitInput(text);
  toast('✓ guardado');
  refresh();
});

document.body.addEventListener('click',async e=>{
  const b=e.target.closest('[data-signal]');
  if(!b)return;
  await submitSignal(b.dataset.target,b.dataset.signal);
  toast('✓ señal guardada');
  refresh();
});

const dlg=document.getElementById('settings');
document.getElementById('settingsBtn').onclick=()=>{
  document.getElementById('apiUrl').value=localStorage.getItem(API_KEY)||'';
  dlg.showModal();
};
document.getElementById('saveSettings').onclick=()=>{
  const v=document.getElementById('apiUrl').value.trim();
  if(v)localStorage.setItem(API_KEY,v);else localStorage.removeItem(API_KEY);
  dlg.close();toast('✓ conexión guardada');refresh();
};

refresh();
setInterval(refresh,15000);
</script>
</body>
</html>
